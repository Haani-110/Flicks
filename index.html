<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Flicks — discover movies, save your watchlist, and ask the AI to find your next favorite film." />
    <meta name="robots" content="index, follow" />
    <!-- The canonical link and the origin-dependent Open Graph tags are set at
         runtime by <Seo /> (src/components/Seo.tsx), from the origin that is
         actually serving the page. A hardcoded one here pointed at a domain
         this project does not own, which is worse than none. -->
    <meta name="theme-color" content="#101315" />
    <meta name="color-scheme" content="dark" />
    <title>Flicks — discover your next favorite film</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Social sharing: the origin-independent half. og:url, og:image and the
         canonical are injected per route by <Seo />. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flicks" />
    <meta property="og:title" content="Flicks — discover your next favorite film" />
    <meta property="og:description" content="Discover movies, save your watchlist, and ask the AI to find your next favorite film." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flicks — discover your next favorite film" />
    <meta name="twitter:description" content="Discover movies, save your watchlist, and ask the AI to find your next favorite film." />

    <link rel="preconnect" href="https://image.tmdb.org" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://image.tmdb.org" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
