name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref — CI should always reflect the tip.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit & component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Component tests with coverage
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile=vitest-report.json

      # Publishes the totals on the run page, so a green CI run states what it
      # verified instead of hiding it in a job log.
      - name: Summarize test results
        if: always()
        run: node scripts/ci-summary.mjs vitest-report.json

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Single gate for branch protection: require "CI green" and every test job is
  # required too, so a red suite blocks merging.
  ci:
    name: CI green
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    if: always()
    steps:
      - name: Check every test job passed
        run: |
          echo "unit=${{ needs.unit.result }}"
          echo "e2e=${{ needs.e2e.result }}"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
